services:
    app:
        container_name: wireguard_app
        env_file:
            - .env
        environment:
            SERVER_NAME: ':8000'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        working_dir: /var/www/html
        command: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile"]
        ports:
            - '${APP_PORT:-8000}:8000'
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/up || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - '.:/var/www/html'
        networks:
            - app
            - oksana-vpn
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    vite:
        container_name: wireguard_vite
        platform: linux/amd64
        env_file:
            - .env
        build:
            context: .
            dockerfile: docker/vite/Dockerfile
        working_dir: /var/www/html
        command: sh -lc "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install; fi && npm run dev"
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - '.:/var/www/html'
            - vite-node-modules:/var/www/html/node_modules
        environment:
            VITE_PORT: '${VITE_PORT:-5173}'
            VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
            VITE_HMR_PORT: '${VITE_HMR_PORT:-5173}'
            CHOKIDAR_USEPOLLING: 'true'
        networks:
            - app
        depends_on:
            - app

    reverb:
        container_name: wireguard_reverb
        env_file:
            - .env
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        working_dir: /var/www/html
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 10s
        volumes:
            - '.:/var/www/html'
        networks:
            - app
        depends_on:
            - app

    console-worker:
        container_name: wireguard_console_worker
        env_file:
            - .env
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        working_dir: /var/www/html
        command: ["php", "artisan", "queue:work", "redis", "--queue=server-console", "--sleep=1", "--tries=1", "--timeout=930"]
        healthcheck:
            disable: true
        volumes:
            - '.:/var/www/html'
        networks:
            - app
            - oksana-vpn
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        container_name: wireguard_mysql
        env_file:
            - .env
        image: mysql:8.4
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d
            - ./docker/mysql/conf.d/99-binlog-retention.cnf:/etc/mysql/conf.d/99-binlog-retention.cnf:ro
        networks:
            - app
            - oksana-vpn
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 5
            timeout: 5s
            interval: 5s
            start_period: 15s

    redis:
        container_name: wireguard_redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        networks:
            - app
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 5
            timeout: 5s
            interval: 5s
            start_period: 5s

networks:
    app:
        driver: bridge
    oksana-vpn:
        external: true

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    vite-node-modules:
        driver: local
